version: 2
updates:
  # pnpm workspaces: one entry at the root covers every package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Conventional Commit titles so release-please versions them correctly:
    # runtime deps → fix(deps) = patch release; dev deps → chore(deps) = no release.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # One PR for routine minor/patch bumps; majors arrive individually so they get real review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # apps/web pins TypeScript 6 for vue-tsc (see CLAUDE.md → Gotchas).
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
