name: PR title

# Squash merges turn the PR title into the commit on main, which release-please
# reads to decide the version bump, so the title must be a Conventional Commit.
#
# pull_request_target, not pull_request: events from GITHUB_TOKEN (release-please's PRs)
# don't start pull_request_target runs, so there's nothing to approve. It runs the workflow
# from the base branch with the base branch's code, which is safe here because we never
# check out or execute the PR's code; we only read its title.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    # Release PR titles are generated by release-please, so there's nothing to check.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Checks out the base branch (the default for pull_request_target): our commitlint config,
      # not the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The title goes through an env var, never inlined into the script (injection-safe).
      - run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
