name: Release

# On each push to main, release-please reads the Conventional Commits since the last
# release and keeps a release PR open (version bump + CHANGELOG). Merging that PR
# tags the release. fix → patch, feat → minor, feat! / BREAKING CHANGE → major
# (minor while below 1.0.0).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
