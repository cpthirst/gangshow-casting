name: CI

# Push, not pull_request: GitHub holds pull_request runs on bot-created PRs (release-please)
# for manual approval, while pushes made with GITHUB_TOKEN never start runs. Results still
# show on the PR because they report against its head commit.
on:
  push:
    # Release PRs only bump version/CHANGELOG; everything they summarise was gated on merge.
    branches-ignore: ["release-please--**"]

# Least privilege: this job only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same gate agents run locally (and the Stop hook enforces).
      - run: pnpm check

  # Browser layout tests (ADR 0011): happy-path walks at phone widths, checking nothing
  # scrolls sideways. Kept out of `pnpm check` so the local gate doesn't need a browser.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Database tests (ADR 0016): the remote stores' tests against DynamoDB Local, with no AWS
  # account or credentials. Kept out of `pnpm check` so the local gate needs no Java or Docker.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        # Pinned by digest (supply-chain safety): amazon/dynamodb-local 3.3.1.
        image: amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        ports:
          - 8000:8000
    env:
      AWS_ENDPOINT_URL_DYNAMODB: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The emulator image has no health check tool, so wait for its port to open.
      - run: timeout 60 bash -c 'until (echo > /dev/tcp/127.0.0.1/8000) 2>/dev/null; do sleep 1; done'
      - run: pnpm test:dynamo
